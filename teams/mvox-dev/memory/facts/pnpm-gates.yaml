# Facts about the pnpm gate commands. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "pnpm check runs svelte-check, then check:workers and check:sw, so its last lines are not the svelte-check summary; grep for COMPLETED to find it."
    ref: package.json
    refute: "grep '\"check' ~/workspace-app/package.json"
    verified: "2026-10-14"

  - fact: "pnpm check runs svelte-kit sync but does not compile Paraglide; pnpm build does, so new message keys need a build before check passes."
    ref: package.json
    refute: "Add a key to messages/en.json and run pnpm check without a build."
    verified: "2026-10-14"
