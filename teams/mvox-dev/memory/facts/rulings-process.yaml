# PO and PO-proxy rulings on how the team runs work and the board. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "The researched label means the research artifact has landed and args can be written; it sits between in research and in process, and reverts only on a re-research dispatch."
    ref: mihkel:2026-09-10
    refute: "=ref"
    verified: "2026-09-10"
  - fact: "#289 is an epic released from deferred; its inventory gates the cutting of sub-issues, and the remote team-lead cuts them."
    ref: "#289"
    refute: "=ref"
    verified: "2026-09-09"
  - fact: "Epic labels belong to the PO and are set by script; the team-lead labels only the issues it picks up and never passes epics to research-pack args."
    ref: gama:2026-10-06
    refute: "=ref"
    verified: "2026-10-06"
  - fact: "Issue kind is the native GitHub issue type (Task, Bug, Feature, Epic); labels carry movement only, and old task or epic labels are never added, stripped or read."
    ref: mihkel:2026-09-18
    refute: "grep -n kindFromType scripts/roadmap/issue-model.ts"
    verified: "2026-10-14"
  - fact: "The Feature issue type is the intake slot for unshaped requests and is never used on shaped work."
    ref: mihkel:2026-09-18
    refute: "=ref"
    verified: "2026-09-18"
  - fact: "Hand work gets a fresh implementer per issue, spawned from scratchpad/brief-<N>.md and released with a shutdown_request once the issue merges, never with a text message."
    ref: mihkel:2026-09-30
    refute: "=ref"
    verified: "2026-10-04"
  - fact: "Fresh teammates are named role plus issue number, such as josquin-881; a multi-issue branch takes the epic or first issue number."
    ref: mihkel:2026-10-11
    refute: "=ref"
    verified: "2026-10-11"
  - fact: "An implementer spawn prompt names the brief and says to run gates in the foreground and to commit and push before reporting."
    ref: mihkel:2026-09-30
    refute: "=ref"
    verified: "2026-09-30"
  - fact: "Finn is released after each research task, Perotin is spawned only for a live-data job, and Bentham is released at the end of each review wave and reviews alone."
    ref: mihkel:2026-10-01
    refute: "=ref"
    verified: "2026-10-01"
  - fact: "Small, pattern-following issues get Josquin on Sonnet with a brief that makes every design call; issues that set a pattern or need judgment get Opus."
    ref: mihkel:2026-10-09
    refute: "=ref"
    verified: "2026-10-09"
  - fact: "A prepped issue launches as soon as its args exist; research runs read-only in parallel and is never a reason to hold an issue for packing."
    ref: mihkel:2026-09-23
    refute: "=ref"
    verified: "2026-09-23"
  - fact: "Review findings about our own docs, fences, pins or evidence lines never become issues; they are recorded where found, and only the product work they block goes to the PO."
    ref: mihkel:2026-09-16
    refute: "=ref"
    verified: "2026-09-16"

  - fact: "Official Entu documentation is authoritative: consult it and believe it; if reality later differs, file a bug report rather than build a verification ladder."
    ref: mihkel:2026-09-06
    refute: "=ref"
    verified: "2026-09-06"
  - fact: "Probes are for behaviour the docs do not cover and for reading back our own writes, never for re-proving documented behaviour."
    ref: mihkel:2026-09-06
    refute: "=ref"
    verified: "2026-09-06"
  - fact: "When the docs come up empty, probe on polyphony with _probe_-prefixed throwaway names, record the result, then propose a docs fix to Argo."
    ref: mihkel:2026-05-19
    refute: "=ref"
    verified: "2026-05-19"
  - fact: "Entu ids are globally unique across databases, so briefs, tests and reviews do not cover the same id appearing in two collectives."
    ref: mihkel:2026-10-06
    refute: "=ref"
    verified: "2026-10-06"

  - fact: "Before any merge verdict, Bentham runs pnpm check and pnpm test on the branch's own bytes; a number read from a journal, commit body or agent report is a claim."
    ref: gama:2026-09-15
    refute: "=ref"
    verified: "2026-10-14"

  - fact: "Running gates is verification, not implementation; Bentham still writes no production code, tests or migrations and creates or merges no PRs."
    ref: teams/mvox-dev/prompts/bentham.md
    refute: "=ref"
    verified: "2026-10-14"

  - fact: "Specs share full copy maps instead of per-spec subset maps; losing the subset map's throw-on-unknown-key is accepted and is not flagged in review."
    ref: gama:2026-10-03
    refute: "=ref"
    verified: "2026-10-03"

  - fact: "A page that must render only certain copy needs an explicit test for it, not a narrow copy map."
    ref: gama:2026-10-03
    refute: "=ref"
    verified: "2026-10-03"

  - fact: "The repo-wide test:source ratio counts tracked .ts and .svelte files under src/ by wc -l at the commit; paths containing paraglide are excluded."
    ref: bentham:2026-10-06
    refute: "=ref"
    verified: "2026-10-06"

  - fact: "In the test:source ratio, test means src/**/*.spec.ts plus everything in src/lib/testing/; source is every other counted file."
    ref: bentham:2026-10-06
    refute: "=ref"
    verified: "2026-10-06"

  - fact: "scripts/, e2e, config files and messages JSON stay out of the repo-wide ratio; a PR's own line split lists touched scripts separately."
    ref: bentham:2026-10-06
    refute: "=ref"
    verified: "2026-10-06"

  - fact: "A UI gate reads Entu's grant on the target entity; a gate that computes access from membership or a stand-in rights check is a YELLOW review finding."
    ref: "#362"
    refute: "=ref"
    verified: "2026-09-18"

  - fact: "RED tests for gated controls use rights fixtures on the target entity, never membership fixtures."
    ref: "#362"
    refute: "=ref"
    verified: "2026-09-18"
