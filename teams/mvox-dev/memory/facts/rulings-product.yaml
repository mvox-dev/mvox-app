# PO rulings on product design and behaviour. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "The season surface is satisfactory as built; no respec is coming and new work builds on it."
    ref: "#277"
    refute: "=ref"
    verified: "2026-09-09"
  - fact: "The display face marks identity, not information; on the attendance panel header it is removed, other uses stay, and no lint enforces the rule."
    ref: "#290"
    refute: "src/lib/components/attendance/AttendanceSurface.headerface.spec.ts"
    verified: "2026-10-14"
  - fact: "A list renders by default; hiding it while loading is an explicit opt-in by a caller that can prove loading finished."
    ref: "#311"
    refute: "=ref"
    verified: "2026-09-10"
  - fact: "Inter is the face for everything load-bearing; Caveat is only for things a person wrote by hand, such as marginalia and conductor notes."
    ref: mihkel:2026-05-23
    refute: "=ref"
    verified: "2026-05-23"
  - fact: "The palette stays warm and paper-based: paper #f7f1e1, ink #2a2620, warm reds, greens, ambers and indigos for state."
    ref: mihkel:2026-05-23
    refute: "grep -rn f7f1e1 src"
    verified: "2026-05-23"
  - fact: "In UI design picks, prefer the variant that makes mvox feel like a particular product over the most efficient one; the base stays clean and character lives in accents."
    ref: mihkel:2026-05-23
    refute: "=ref"
    verified: "2026-05-23"
  - fact: "All dropdowns are native select elements and all inputs are native controls; a custom widget where a native one serves is a YELLOW review finding."
    ref: teams/mvox-dev/memory/architecture-decisions.md
    refute: "=ref"
    verified: "2026-10-14"
  - fact: "An in-place edit field activates on a click anywhere in the field and on Tab, including always-editable inputs such as profile name and email."
    ref: teams/mvox-dev/memory/architecture-decisions.md
    refute: "=ref"
    verified: "2026-10-14"
  - fact: "Times show 24h unless the profile picks AM/PM, weeks start on Monday, and dates use YYYY-MM-DD; overriding native locale rendering for these is the one sanctioned custom control."
    ref: teams/mvox-dev/memory/architecture-decisions.md
    refute: "=ref"
    verified: "2026-10-14"
  - fact: "User stories are drafted after checking the legacy app at urls/polyphony-uk, which is the spec source for how features were conceived."
    ref: teams/mvox-dev/memory/architecture-decisions.md
    refute: "=ref"
    verified: "2026-10-14"
  - fact: "Fallbacks are a last resort: when a primary mechanism fails, the code throws, blocks the feature or reports it, unless the PO has accepted a fallback and it is documented."
    ref: mihkel:2026-06-12
    refute: "=ref"
    verified: "2026-06-12"

  - fact: "A core aim of mvox is letting federations broker the relationship between amateur collectives and sheet-music publishers such as Carus and SP-Music."
    ref: mihkel:2026-05-31
    refute: "=ref"
    verified: "2026-05-31"
  - fact: "Library, edition and licensing features are designed so publishers see federations on mvox as a legitimate acquisition channel, not a piracy risk."
    ref: mihkel:2026-05-31
    refute: "=ref"
    verified: "2026-05-31"
  - fact: "A score copy is lent only to a member of the same organization as the copy; an umbrella organization does not lend to its child collectives."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
  - fact: "App code enforces same-organization lending, because Entu has no cross-property constraints."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"

  - fact: "While a write for an item is in flight, its control is disabled; a second tap is never coalesced into a later write."
    ref: teams/mvox-dev/memory/byrd.md
    refute: "=ref"
    verified: "2026-08-07"
