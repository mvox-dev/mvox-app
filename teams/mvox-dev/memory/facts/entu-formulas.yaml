# Facts about Entu formula properties. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "A formula value is stored on the instance and stays after its source properties are deleted."
    ref: "2026-05-20"
    refute: "Delete a formula's source property on a polyphony test entity and re-read."
    verified: "2026-05-20"
  - fact: "Formula properties cannot be edited by hand: a direct POST returns 2xx, but the next read shows the re-evaluated formula."
    ref: urls/entu-docs-formulas
    refute: "git -C ~/projects/entu-www show origin/main:src/overview/properties/index.md"
    verified: "2026-10-14"
  - fact: "A formula over always-empty sources can store a single space, so a check before deleting sources must test for a non-whitespace character."
    ref: "2026-05-20"
    refute: "Read name on a person with no forename or surname."
    verified: "2026-05-20"
  - fact: "Documented formula operators include UPPER, LOWER, REGEX, FLOOR, CEIL, UNIQUE, SORT, NUMBER, DATE, DATETIME, AND, OR and NOT; quote the doc, not this list."
    ref: urls/entu-docs-formulas
    refute: "git -C ~/projects/entu-www show origin/main:src/api/formulas/index.md"
    verified: "2026-10-14"
  - fact: "Inside a formula a datetime is a UTC ISO string with milliseconds and a reference is the referenced entity's name; REGEX cannot shift time zones."
    ref: urls/entu-docs-formulas
    refute: "git -C ~/projects/entu-www show origin/main:src/api/formulas/index.md"
    verified: "2026-10-14"
  - fact: "A formula result is stored by its own type; the formula property's declared type does not convert it."
    ref: urls/entu-docs-formulas
    refute: "git -C ~/projects/entu-www show origin/main:src/api/formulas/index.md"
    verified: "2026-10-14"
  - fact: "Crede's event name formula, set by hand by Mihkel, joins the date part of start_datetime, event_type and event_name with ' -- '."
    ref: "#421"
    refute: "Read the event name property definition on crede."
    verified: "2026-09-21"
