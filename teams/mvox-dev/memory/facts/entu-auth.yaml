# Facts about Entu authentication: API keys and tokens. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "An Entu API key is an entu_api_key property, usually on a person entity; only its hash is stored, the raw key is shown once, and an entity may hold several keys."
    ref: urls/entu-docs-authentication
    refute: "git -C ~/projects/entu-www show origin/main:src/api/authentication/index.md"
    verified: "2026-10-14"
  - fact: "An API key has no expiry of its own; it works until its property value is deleted or overwritten."
    ref: argo:2026-05-20
    refute: "git -C ~/projects/entu-www show origin/main:src/api/authentication/index.md"
    verified: "2026-05-20"
  - fact: "Exchanging a deleted or overwritten API key at GET /api/auth returns an anonymous token with empty accounts, not an error, so callers must check accounts is non-empty."
    ref: argo:2026-05-20
    refute: "Exchange a deleted key at GET /api/auth and inspect accounts."
    verified: "2026-05-20"
  - fact: "Entu tokens are valid for 12 hours and are bound to the IP that obtained them; a request from another IP is rejected with 401."
    ref: urls/entu-docs-authentication
    refute: "git -C ~/projects/entu-www show origin/main:src/api/authentication/index.md"
    verified: "2026-10-14"
  - fact: "Tokens from Entu's OAuth server are the exception: they are not IP-bound and cannot be refreshed."
    ref: urls/entu-docs-authentication
    refute: "git -C ~/projects/entu-www show origin/main:src/api/authentication/index.md"
    verified: "2026-10-14"
  - fact: "The login session token must be exchanged for a JWT from the same browser that completed the login; a server-side exchange fails the IP check."
    ref: urls/entu-docs-authentication
    refute: "git -C ~/projects/entu-www show origin/main:src/api/authentication/index.md"
    verified: "2026-10-14"
  - fact: "Server-side use of a browser-obtained Entu token or key fails, even just to read identity from it; the exchange returned an anonymous token rather than a clean 401."
    ref: palestrina:2026-06-13
    refute: "Exchange a browser-issued key from a server and inspect accounts."
    verified: "2026-06-13"
  - fact: "An Entu auth failure arrives as an error body with status 401, not as an empty entities list; check res.ok before parsing."
    ref: "2026-05-23"
    refute: "Send a request with a token from another IP and inspect the body."
    verified: "2026-05-23"
