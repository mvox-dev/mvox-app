# PO rulings on the mvox schema. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "The link entity is an mvox app extension, free of v4E; only admins write it, and it carries display_order, name, url and description only."
    ref: "#256"
    refute: "=ref"
    verified: "2026-09-09"

  - fact: "mvox does not use _noaccess; rights are positive-only through _owner, _editor, _expander and _viewer, and access is revoked by removing a grant."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
  - fact: "Takedowns and per-user denial use app-level checks or grant removal, never _noaccess."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
  - fact: "The mvox schema is independent; v4E in entu/research is historical reference, not a sync target, and no upstream PRs go there."
    ref: mihkel:2026-09-06
    refute: "=ref"
    verified: "2026-09-06"
  - fact: "A new entity type or shape needs a PO ruling on its commissioning issue and a PO-Approved: trailer on the mvox PR; the Schema-Change: trailer is retired."
    ref: mihkel:2026-09-06
    refute: "=ref"
    verified: "2026-09-06"
  - fact: "Each organization's library is its own entity, a direct child of the organization, and the librarian role is _editor on that library."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
  - fact: "The catalog lives under the library: work under library, edition under work, copy under edition, and lending under library."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
  - fact: "There is no separate inventory_item entity; an edition carries both publication and acquisition data."
    ref: mihkel:2026-05-17
    refute: "=ref"
    verified: "2026-05-17"
