# Facts about Entu entities, types and sharing at create. Converted by memkit 2026-10-14. (*MVOX:memkit*)
facts:
  - fact: "A new entity takes _sharing from its parents unless the request sets it: public if any parent is public, else domain if any is domain, else none, meaning private."
    ref: urls/entu-docs-entities
    refute: "git -C ~/projects/entu-www show origin/main:src/overview/entities/index.md"
    verified: "2026-10-14"
  - fact: "_sharing is not live-inherited: changing a parent's _sharing later leaves existing children unchanged, and a deleted _sharing value does not come back."
    ref: "2026-06-06"
    refute: "Change a parent's _sharing on polyphony and read a child."
    verified: "2026-06-06"
  - fact: "A type definition's _sharing does not reach its instances."
    ref: "2026-06-06"
    refute: "git -C ~/projects/entu-www show origin/main:src/overview/entities/index.md"
    verified: "2026-06-06"
  - fact: "Renaming an entity type needs no data migration: instances point at the type's _id, and _type.string catches up within about a second."
    ref: "2026-05-19"
    refute: "Rename a _probe_ type on polyphony and query by _type.string."
    verified: "2026-05-19"
  - fact: "Renaming a property needs a per-instance backfill; existing values stay under the old property name."
    ref: "2026-05-19"
    refute: "Rename a _probe_ property definition and read an instance."
    verified: "2026-05-19"

  - fact: "_inheritrights is set per entity: when true, the entity inherits its parents' rights; a type's _inheritrights does not govern its instances."
    ref: teams/mvox-dev/memory/team-lead-archive.md
    refute: "git -C ~/projects/entu-www show origin/main:src/overview/data-flow/index.md"
    verified: "2026-10-14"

  - fact: "A new child of a parent that has _inheritrights true gets _inheritrights true automatically; otherwise it stays absent, which reads the same as false."
    ref: teams/mvox-dev/memory/perotin.md
    refute: "git -C ~/projects/entu-www show origin/main:src/configuration/best-practices/index.md"
    verified: "2026-10-14"

  - fact: "Creating a child needs at least _expander rights on the parent; _editor and _owner include _expander."
    ref: teams/mvox-dev/memory/perotin.md
    refute: "git -C ~/projects/entu-www show origin/main:src/overview/entities/index.md"
    verified: "2026-10-14"

  - fact: "The entu_user string on a create only triggers minting an account and is deleted at create whatever its value, so a fixed constant can stand in for an invitee's email."
    ref: teams/mvox-dev/memory/tallis.md
    refute: "entu-api utils/entity.js entu_user handling"
    verified: "2026-08-07"

  - fact: "mvox databases have no add_user property (deleted in #22); code never reads it, and a person's _parent at bootstrap is the database entity's own _id."
    ref: "#22"
    refute: "grep -rn add_user ~/workspace-app/src"
    verified: "2026-10-14"
