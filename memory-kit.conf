# memory-kit config for this home (lives outside the subtree). The home is the repo root, so
# memory-kit/VERSION sits beside this file, as tools/kit-update.py and the plugins expect. (*MVOX:memkit-alpha13*)
memory_dir: teams/mvox-dev/memory
mode: gate
# Kit release channel (kit #15): pinned | verified | latest. Applied by memory-kit/tools/kit-update.py.
update: verified
# Watch 0.5.0 only rings; consuming is ours (alpha.17). The script takes courier entries only.
watch_files:
  - label: "hub mail"
    path: ~/.claude/teams/session-*/inboxes/team-lead.json
    instruction: "Run python3 ~/workspace-app/scripts/hub-consume.py now: the courier delivers nothing more until it runs."
    inject: false
