# #305 — Roadmap board: renders a static page from this repo's issues and
# publishes it to GitHub Pages at docs.mvox.eu/roadmap.
#
# First Actions workflow in this repo — no in-repo precedent to follow, so
# this is built on GitHub's own configure-pages / upload-pages-artifact /
# deploy-pages reference pattern.
#
# Test-before-deploy: the "build" job runs `pnpm test` (the full suite,
# including scripts/roadmap/cli.spec.ts's real end-to-end build over a
# fixture) BEFORE fetching live issues or rendering. Any failure there stops
# the job, so `deploy` (which `needs: build`) never runs and the live page
# stays as it was — never replaced by a broken build.
#
# Node version: pinned via `node-version-file: package.json`, which reads
# the repo's `engines.node` field (set to "22.x" — see package.json). One
# source of truth for the pin; nothing in the workflow hardcodes a version.
#
# (*MVOX:Palestrina*)
name: Roadmap board

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch: {}

# The newest issue event wins, and a stuck run never freezes the board. A deploy once sat
# waiting for a runner for 12 hours (2026-10-06, run 37508931485) while every later run
# queued behind it. A cancelled deploy leaves the last good page live (seen that day).
# Builds: a newer run cancels an older build. Deploys: a newer deploy cancels a stuck one.

# Scoped to what the `build` job below actually calls. Job-level `permissions:`
# REPLACE this block rather than merging with it, so the write scopes the deploy
# stays with deploy (see its own block) instead of riding along on the job that
# runs `pnpm test` and a live fetch.
permissions:
  contents: read
  # Needed for the fetch step's authenticated issue reads (open + closed +
  # sub-issues). Not in the issue's own literal permissions list, but the
  # fetch step cannot read issues at all without it once a `permissions:`
  # block is declared — an explicit block replaces the default token scopes
  # rather than narrowing them.
  issues: read
  # actions/configure-pages reads the site config (GET /repos/{owner}/{repo}/pages),
  # which GitHub classifies as Pages READ. It does not create the site here:
  # the action's `enablement` input defaults to false and would need a token
  # other than GITHUB_TOKEN anyway. Read is therefore the whole requirement —
  # dropping `pages` altogether would leave the token at `none` and 403 the
  # Configure Pages step.
  pages: read

jobs:
  # A closed issue is out of the queue: strip its motion labels (Mihkel, 2026-10-10).
  clear-motion-labels:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove motion labels from the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          for label in "ready" "in research" "researched" "prepped" "in process" "in human review"; do
            if echo "$LABELS" | jq -e --arg l "$label" 'index($l)' > /dev/null; then
              gh issue edit "$NUMBER" --repo "$REPO" --remove-label "$label"
            fi
          done

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: roadmap-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: a failing test stops here, before any live fetch or render —
      # the deploy job below never starts, and the current live page stays up.
      #
      # #413 — the gate runs the ROADMAP's tests, not the whole suite. It used
      # to run `pnpm test`, so any red test anywhere froze a page built from
      # nothing but issue data: on 2026-09-19 a prompt-template fence
      # (pipeline-ref-discipline.spec.ts) held the board stale for ten hours
      # while every issue behind it was current.
      #
      # The scope is not a preference: every non-spec file under
      # scripts/roadmap/ imports only its siblings, node builtins and `yaml`,
      # so these tests cover the whole render path. That property is itself
      # pinned by scripts/roadmap/gate-scope.spec.ts — if a render-path file
      # ever reaches outside this directory, that test fails and this gate's
      # narrowness has to be re-argued rather than quietly going blind.
      - name: Test (gate before any deploy)
        run: pnpm test:roadmap

      - name: Fetch issues
        run: node --import tsx scripts/roadmap/fetch-issues.ts --out ./roadmap-build/issues.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render board
        run: node --import tsx scripts/roadmap/render.ts --input ./roadmap-build/issues.json --out ./roadmap-build/site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./roadmap-build/site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: roadmap-deploy
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
