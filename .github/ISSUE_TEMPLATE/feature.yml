# Feature form — intake, unshaped by definition. Slugline/lead are optional
# HERE and required at RELEASE (#405): intake stays cheap, the public board
# stays homogeneous. issue-model.ts enforces the release half.
# Feature form — One required field: the ask,
# verbatim. Shaping into tasks happens later, on the board.
name: Feature
description: A request or idea, in your own words. Shaping comes later.
title: "What you want to be able to do"
type: Feature
body:
  - type: textarea
    id: request
    attributes:
      label: The request
      description: Oma sõnadega, nii nagu pähe tuli. Vormistamata jätmine on siin õige.
    validations:
      required: true
  - type: input
    id: who-is-it-for
    attributes:
      label: Who is it for
      placeholder: "laulja / dirigent / admin"
  - type: input
    id: slugline
    attributes:
      label: Slugline
      description: Üks eestikeelne rida avalikule tahvlile. Sisestusel võib tühjaks jääda — enne väljalaset on see kohustuslik.
    validations:
      required: false
  - type: textarea
    id: lead
    attributes:
      label: Lead
      description: Üks-kaks eestikeelset lauset — mida see muudab ja kellele. Sama reegel mis sluglinel.
    validations:
      required: false
